# Los chequeos que comparten todas las aplicaciones de VasakOS.
#
# Vive acá y no copiado en cada repositorio: son treinta y pico, y un chequeo
# copiado treinta veces es un chequeo que en algunos queda viejo. Cada
# repositorio pone un archivo de cinco líneas que llama a éste.
#
# ── Qué mira, y por qué justo esto ──────────────────────────────────────────
#
# Hasta hoy no había ninguna comprobación automática en ningún repositorio: todo
# corría a mano en la máquina de quien compilaba, justo antes de compilar. Estos
# cuatro son los que efectivamente mordieron:
#
#   versión   Cuatro archivos declaran el número y ninguno lee al otro. Uno que
#             se queda atrás hace que el paquete no se recompile, y lo mergeado
#             no llega a nadie: pasó con once paquetes de una vez.
#   lint      El `$schema` de biome se quedó viejo en catorce repositorios y
#             frenó una compilación entera, sin que hubiera nada mal en el
#             código.
#   tipos     `vue-tsc --noEmit` es parte del build de Tauri, así que un import
#             sin usar no rompe en `bun run dev` y sí impide empaquetar. Va sin
#             `--bun`: bajo ese runtime degrada a `tsc` y deja de mirar los
#             `.vue`, que en una aplicación Vue es casi todo el código.
#   pruebas   Las de frontend, que existían y no las corría nadie: 604 en trece
#             repositorios, todas pasando y ninguna vigilada. El paso de tipos
#             sólo cubre a los que compilan con `vue-tsc`, y el de Rust sólo al
#             backend.
#   candado   `makepkg` compila con `--locked`. Un `Cargo.lock` desfasado corta
#             la compilación por la mitad, y compilando a mano no se ve nunca
#             porque cargo lo actualiza solo.
#
# No compila el backend de Rust todavía: un Tauri necesita webkit2gtk y medio
# escritorio instalado, y eso es una tanda de apt de varios minutos en cada
# corrida. Vale la pena sumarlo, pero como paso aparte y pensado. Ese paso ya
# está —es la entrada `paquetes_rust`— y la lista la declara el repositorio
# que la necesita, no este archivo: una lista fija de Tauri acá la pagarían los
# treinta y pico que llaman, casi ninguno la usaría, y se quedaría vieja sola
# el día que un grafo cambiara.

name: Chequeos de aplicación

on:
  workflow_call:
    inputs:
      rust:
        description: Si el repositorio tiene backend de Rust que comprobar.
        type: boolean
        default: true
      pruebas_rust:
        description: >
          Crates cuyas pruebas correr, en la forma que espera `cargo test`
          (`-p uno -p otro`). Vacío por omisión y hay que pedirlo a mano: un
          crate de Tauri arrastra webkit2gtk y medio escritorio, y eso son
          varios minutos de apt en cada corrida. Los que no dependen de Tauri
          compilan en un runner pelado y ahí sí conviene.
        type: string
        default: ''
      paquetes_rust:
        description: >
          Paquetes de Debian que hay que instalar **antes** de `cargo test`, en
          la forma que espera `apt-get install` (`uno dos`; también acepta una
          lista de YAML de varias líneas, que se separa igual). Para los
          repositorios cuyo grafo no compila en un runner pelado: los que
          necesitan la lista de `libwebkit2gtk-4.1-dev` más `build-essential`
          la piden, y el resto no la pasan. Vacío por omisión, y vacío no
          instala nada —ni un `apt-get update`—, que es lo que lo hace gratis
          para los treinta y pico que llaman. La lista la declara el
          repositorio que la necesita y sale de los `.pc` que **su** grafo pide
          de verdad, no de la lista de Tauri: acá no se puede saber qué
          encabezados hacen falta sin compilar el crate, y una lista fija se
          queda vieja sola. Es la misma razón por la que `vasak-shot` no la
          tiene metida en su propio flujo.
        type: string
        default: ''
      bibliotecas_cortan:
        description: >
          Si una biblioteca propia **fuera del alcance de su rango** corta la
          corrida en vez de sólo avisar. Empieza en falso a propósito: al
          estrenarse esta comprobación quince repositorios estaban atrás, y
          hacerla fallar de entrada habría bloqueado todo el trabajo —incluido
          el de ponerse al día—. Cada repositorio que se pone al día lo
          enciende, y así no se vuelve a quedar atrás.
        type: boolean
        default: false
      candado_corta:
        description: >
          Si un candado atrasado —el rango alcanza y `bun.lock` se quedó en una
          versión vieja— también corta. Va aparte de `bibliotecas_cortan` y
          empieza en falso por el mismo motivo que aquél empezó así: el día que
          esta comprobación se estrenó había once repositorios en esa
          situación **con el guardia en verde**, y encenderla junto con la otra
          les habría bloqueado el próximo PR antes de poder ponerse al día.
        type: boolean
        default: false
      seguridad_corta:
        description: >
          Si una vulnerabilidad conocida en las dependencias —o un problema en
          los propios workflows— corta la corrida en vez de sólo avisar. Empieza
          en falso por lo mismo que las otras dos: el día que se estrenó, el
          escritorio solo ya traía once avisos, casi todos de la pila de GTK 3
          que arrastra Tauri y que no tienen arreglo publicado. Cada repositorio
          que quede en cero lo enciende.
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        description: >
          El token de SonarQube Cloud. Opcional: sin él, el análisis se saltea
          y lo dice. Llega sólo si quien llama lo pasa por nombre —no con
          `secrets: inherit`, que le daría también el token de crates.io y el de
          npm a un trabajo que instala dependencias de terceros—, y nunca llega
          a un PR que viene de un fork, que es lo correcto.
        required: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    # Lo único que hace esto es leer el repositorio: clona, instala
    # dependencias y corre comprobaciones. No comenta, no etiqueta, no publica.
    #
    # Sin declararlo, el trabajo recibe los permisos por omisión del
    # repositorio, que en los más viejos incluyen escritura sobre casi todo. Un
    # paso comprometido —una acción de terceros, una dependencia— tendría ese
    # token a mano. Va acá y no en cada repositorio que llama: son veintiocho, y
    # el permiso que importa es el del trabajo que corre.
    permissions:
      contents: read
    steps:
      # Las acciones van clavadas al commit y no a la etiqueta: una etiqueta
      # se puede mover, y quien pueda moverla decide qué corre acá. Es el
      # mismo commit que ya usa el flujo de publicación de este taller.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Sin dejar el token en `.git/config`: acá nada empuja, y un token
          # guardado en disco es un token que cualquier paso siguiente puede
          # leer —una dependencia instalada, un script de prueba—.
          persist-credentials: false
          # El paso de formato compara contra la base del PR, y para eso hace
          # falta el historial: el checkout por omisión trae un commit solo y
          # no habría con qué comparar.
          fetch-depth: 0

      # ── La versión, que es lo más barato de comprobar y lo que más costó ──
      - name: Los manifiestos dicen la misma versión
        run: |
          # Ojo con `set -e`, que GitHub pone por omisión (`bash -e`): un `grep`
          # que no encuentra nada devuelve 1 y corta el script entero, y un
          # `[ cond ] && asignación` con la condición falsa, también. Las dos
          # cosas pasan acá todo el tiempo —un repositorio sin `src-tauri`, un
          # miembro de workspace que dice `version.workspace = true`— así que
          # cada una lleva su `|| true` o su `if`. Esta comprobación se estrenó
          # fallando por esto mismo.
          declara() { # archivo, cómo leerlo
            [ -f "$1" ] || return 0
            case "$2" in
              json) grep -m1 -Po '"version"\s*:\s*"\K[^"]*' "$1" || true ;;
              toml) grep -m1 -Po '^version\s*=\s*"\K[^"]*' "$1" || true ;;
            esac
          }

          declaradas=""
          for par in "package.json:json" "src-tauri/tauri.conf.json:json"; do
            v=$(declara "${par%%:*}" "${par##*:}")
            if [ -n "$v" ]; then
              declaradas="$declaradas ${par%%:*}=$v"
            fi
          done

          # En un workspace el miembro dice `version.workspace = true` y el
          # número vive en la raíz: si el de src-tauri no aparece, se cae al de
          # arriba.
          v=$(declara "src-tauri/Cargo.toml" toml)
          if [ -z "$v" ]; then
            v=$(declara "Cargo.toml" toml)
          fi
          if [ -n "$v" ]; then
            declaradas="$declaradas Cargo.toml=$v"
          fi

          echo "Declaradas:${declaradas:- (ninguna)}"
          distintas=$(printf '%s' "$declaradas" | tr ' ' '\n' | grep -c . || true)
          unicas=$(printf '%s' "$declaradas" | tr ' ' '\n' | grep . | cut -d= -f2 | sort -u | wc -l)
          if [ "$distintas" -gt 1 ] && [ "$unicas" -gt 1 ]; then
            echo "::error::Los manifiestos declaran versiones distintas:$declaradas"
            exit 1
          fi

      # ── El frontend ──────────────────────────────────────────────────────
      #
      # Clavada al commit como las demás. Era la única de los tres flujos que
      # seguía apuntando a una etiqueta, y es la que más expuesta estaba: una
      # etiqueta se puede mover, y ésta corre en los treinta y pico
      # repositorios y justo antes de `bun install`, así que quien pudiera
      # moverla decidiría qué se ejecuta en todos a la vez.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: hashFiles('package.json') != ''

      - name: Instalar dependencias
        if: hashFiles('package.json') != ''
        run: bun install --frozen-lockfile

      # El guardia vive en un archivo y no incrustado acá porque tiene lógica
      # que se puede equivocar en silencio —qué acepta cada forma de rango— y
      # todo lo que corre en treinta repositorios necesita pruebas. Se trae el
      # repositorio compartido a un subdirectorio para poder ejecutarlo: es
      # público, y se toma de `main` porque con `@main` se llama este mismo
      # flujo.
      - name: Traer los scripts compartidos
        if: hashFiles('package.json') != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Vasak-OS/.github
          persist-credentials: false
          # `main` y no un commit fijo: los 35 repositorios llaman a este
          # flujo con `@main`, así que el script y el flujo se mueven juntos.
          # Clavarlo acá los separaría —el flujo nuevo con el script viejo— que
          # es justo la forma de fallar que este guardia vino a evitar.
          ref: main
          path: .vasak-ci

      - name: Las bibliotecas propias están al día
        if: hashFiles('package.json') != ''
        run: |
          # El directorio traído queda **dentro** del árbol del repositorio que
          # se está revisando, y el paso de lint corre `biome check .`: si se
          # quedara, se lintearían archivos de otro repositorio y el error
          # aparecería en un PR que no los tocó. Se saca apenas se usa, y el
          # código de salida se conserva a mano porque `rm` lo pisaría.
          estado=0
          python3 .vasak-ci/scripts/bibliotecas_al_dia.py \
            ${{ inputs.bibliotecas_cortan && '--cortar' || '' }} \
            ${{ inputs.candado_corta && '--el-candado-corta' || '' }} || estado=$?
          rm -rf .vasak-ci
          exit $estado

      - name: Lint
        if: hashFiles('biome.json') != ''
        run: bunx --bun biome check .

      - name: Tipos
        # Sólo donde el build ya los exige: si el repositorio no llama a
        # `vue-tsc`, empaquetarlo tampoco lo hace y exigirlo acá sería inventar
        # una regla que no existe.
        #
        # **Sin `--bun`.** Bajo el runtime de Bun, `vue-tsc` no encuentra el
        # gancho que le deja leer los componentes de un solo archivo y degrada
        # a `tsc` a secas: comprueba los `.ts` y **no mira ningún `.vue`**. No
        # avisa y termina en cero, así que este paso venía dando el visto bueno
        # sin haber abierto el 90% del código de una aplicación Vue. Se
        # comprobó metiendo un `const x: number = 'texto'` en un `.vue`: con
        # `--bun` no sale nada, sin él salta el error.
        if: hashFiles('package.json') != ''
        run: |
          if grep -q 'vue-tsc --noEmit' package.json; then
            bunx vue-tsc --noEmit
          else
            echo "Este repositorio no pasa por vue-tsc; nada que comprobar."
          fi

      - name: Pruebas del frontend
        if: hashFiles('package.json') != ''
        run: |
          # Se pregunta por el script con un parser y no con un `grep`: un
          # `"test"` suelto también aparece en las dependencias, y ahí el grep
          # diría que sí sobre un repositorio que no tiene pruebas.
          if bun -e 'const p = await Bun.file("package.json").json(); process.exit(p.scripts?.test ? 0 : 1)'; then
            bun run test
          else
            echo "Este repositorio no declara pruebas de frontend."
          fi

      # ── El backend ───────────────────────────────────────────────────────
      # ── El formato, sólo en lo que el PR toca ────────────────────────────
      #
      # Mira los archivos que el PR agrega o cambia y ningún otro. Esto no es
      # timidez: `cargo fmt --check` entero hoy da 1.734 diferencias repartidas
      # en 31 de los 32 repositorios con Rust, así que estrenarlo completo
      # pondría en rojo a casi toda la organización por código que ese PR no
      # tocó. Es exactamente lo que ya pasó con `--locked`, que debutó fallando
      # en seis.
      #
      # Acotado a lo que el PR toca, en cambio, frena la deriva desde el primer
      # día y no cobra nada por el pasivo: lo viejo se va formateando solo, a
      # medida que se lo edita por otra razón. Cuando el pasivo llegue a cero
      # —o si se lo salda de una con un PR mecánico por repositorio— esto se
      # endurece borrando el filtro.
      - name: El formato de Rust en lo que toca el PR
        if: inputs.rust && github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          # `ACMR` deja afuera los borrados: pedirle el formato a un archivo
          # que el PR eliminó falla siempre y no dice nada.
          base=$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)
          mapfile -t tocados < <(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.rs')

          if [ ${#tocados[@]} -eq 0 ]; then
            echo "Este PR no toca ningún .rs; nada que comprobar."
            exit 0
          fi

          # Se corre `cargo fmt` y no `rustfmt` a secas porque la edición sale
          # del manifiesto: siete crates de la organización la heredan del
          # workspace con `edition.workspace = true`, y rustfmt suelto no sabe
          # resolver eso — asumiría 2015 y marcaría diferencias inventadas.
          #
          # Por cada archivo tocado se busca su Cargo.toml más cercano, que es
          # lo que hace que esto cubra el repositorio entero y no una carpeta
          # elegida a mano.
          manifiestos=$(
            for archivo in "${tocados[@]}"; do
              dir=$(dirname "$archivo")
              while [ "$dir" != "." ] && [ ! -f "$dir/Cargo.toml" ]; do
                dir=$(dirname "$dir")
              done
              [ -f "$dir/Cargo.toml" ] && echo "$dir"
            done | sort -u
          )

          if [ -z "$manifiestos" ]; then
            echo "Los .rs que toca el PR no cuelgan de ningún Cargo.toml; nada que comprobar."
            exit 0
          fi

          # `cargo fmt --check` no escribe nada y sale distinto de cero cuando
          # hay diferencias, así que no se puede cortar acá: todavía no se sabe
          # cuáles son de este PR.
          #
          # Pero «distinto de cero» también es lo que sale cuando no pudo correr
          # —rustfmt ausente, manifiesto ilegible—, y ahí los dos casos salen 1.
          # Descartarlo sin mirar dejaría el archivo de diferencias vacío y el
          # paso diría «sin diferencias»: verde sin haber comprobado nada, que
          # es peor que no tener la comprobación. Lo que los separa es que un
          # fallo operativo no produce ninguna línea `Diff in` y sí escribe en
          # stderr; unas diferencias de verdad hacen exactamente lo contrario.
          diferencias=$(mktemp)
          for manifiesto in $manifiestos; do
            antes=$(wc -l < "$diferencias")
            errores=$(mktemp)
            if ! ( cd "$manifiesto" && cargo fmt --check ) >> "$diferencias" 2>"$errores"; then
              # Se mira si produjo diferencias y no si stderr trae algo: cargo
              # avisa por stderr de cosas que no son fallos —una clave de más
              # en el manifiesto, por ejemplo— y eso no tiene que voltear el
              # paso.
              if [ "$(wc -l < "$diferencias")" -eq "$antes" ]; then
                echo "::error::No se pudo comprobar el formato en «$manifiesto»; el paso no llegó a mirar nada."
                cat "$errores" >&2
                exit 1
              fi
            fi
          done

          # De todo lo que salió, sólo lo que este PR tocó.
          sin_formatear=()
          for archivo in "${tocados[@]}"; do
            if grep -qF "Diff in $PWD/$archivo:" "$diferencias"; then
              sin_formatear+=("$archivo")
            fi
          done

          if [ ${#sin_formatear[@]} -eq 0 ]; then
            echo "Sin diferencias de formato en lo que toca el PR."
            exit 0
          fi

          for archivo in "${sin_formatear[@]}"; do
            echo "::error file=$archivo::Sin formatear. Corré «cargo fmt» y volvé a subir."
          done
          if [ ${#sin_formatear[@]} -eq 1 ]; then
            echo "::error::Hay un archivo sin formatear. Se comprueba sólo lo que toca este PR."
          else
            echo "::error::Hay ${#sin_formatear[@]} archivos sin formatear. Se comprueba sólo lo que toca este PR."
          fi
          exit 1

      - name: El candado de Cargo está al día
        if: inputs.rust && (hashFiles('Cargo.toml') != '' || hashFiles('src-tauri/Cargo.toml') != '')
        run: |
          # Sólo donde el candado está versionado.
          #
          # Una biblioteca no lo versiona, y eso es lo correcto: quien la usa
          # resuelve sus propias versiones. Exigirlo ahí sería inventar una
          # regla que Rust no tiene — y es lo que hizo que esta comprobación
          # se estrenara en rojo en seis repositorios, donde `--locked` no
          # fallaba por desfasaje sino porque no había candado que leer.
          candado=$(git ls-files '*Cargo.lock' | head -1)
          if [ -z "$candado" ]; then
            echo "Este repositorio no versiona su Cargo.lock; nada que comprobar."
            exit 0
          fi

          # `cargo metadata` resuelve el grafo sin compilar nada, así que no
          # hacen falta las dependencias de sistema de Tauri. Es exactamente la
          # comprobación que hace fallar a `makepkg --locked`.
          cd "$(dirname "$candado")"
          if ! cargo metadata --locked --format-version 1 >/dev/null; then
            echo "::error::El Cargo.lock no coincide con el Cargo.toml. makepkg compila con --locked y va a fallar."
            exit 1
          fi

      # ── Las dependencias de sistema que pide el grafo ────────────────────
      #
      # Un paso aparte y no unas líneas al principio del de pruebas, por dos
      # motivos. Uno, que una tanda de apt son minutos y tienen que verse en un
      # paso con su nombre: si comparte paso con `cargo test`, un fallo del
      # `apt` y un fallo del `cargo` salen en el mismo bloque y se confunden.
      # Dos, que la lista la declara el repositorio que la necesita
      # (`paquetes_rust`) y no este archivo, porque los encabezados que faltan
      # los decide el grafo de cada uno y acá no hay forma de averiguarlo.
      #
      # **Falla fuerte, y a propósito.** Este trabajo es la puerta que exigen
      # las reglas de `main`, y la filosofía del taller —escrita en
      # `vasak-wireplumber-modules`— es que un paso que no puede fallar no
      # comprueba nada y hace creer que sí. acá el costo de tragarse el fallo
      # además no es un falso verde sino un error de cargo a mitad del grafo y
      # muy lejos de la causa: los `build.rs` de los `-sys` llaman a
      # `process::exit(1)` cuando falta un `.pc`, así que se lee como un crate
      # que no compila y no como un paquete que no estaba. El `set -e` que
      # GitHub pone por omisión —del que este archivo entero depende desde su
      # primer paso— es lo que hace que esto corte acá y no más abajo.
      - name: Las dependencias de sistema de Rust
        # Con `if:` y no con un `if` adentro del script, que es lo que deja los
        # treinta y pico que no pasan la lista sin pagar ni un `apt-get update`.
        # Un `apt-get update` cacheado en cada repositorio, en un flujo que
        # corre todo el tiempo, es exactamente la regresión que se está
        # evitando.
        #
        # `!cancelled()` en éste y en los pasos de Rust que siguen: corren
        # aunque un paso anterior —el lint, los tipos, el formato— haya
        # fallado. Sin esto, un `cargo fmt` pendiente se salteaba las pruebas
        # de Rust, `sonar` analizaba sin el informe y el Rust desaparecía del
        # análisis del PR justo en la corrida en la que había algo que
        # corregir. El paso sigue en rojo igual; lo que cambia es que se sabe
        # también cómo están las pruebas.
        if: ${{ !cancelled() && inputs.paquetes_rust != '' }}
        # Por variable de entorno y no con `${{ }}` dentro del script, por lo
        # mismo que el paso de abajo: la plantilla se pega como texto en el
        # bash antes de correr, así que un valor con `;` o `$( )` se ejecutaría.
        # Con una lista de paquetes el riesgo es el mismo y el premio el mismo.
        env:
          DEBIAN_FRONTEND: noninteractive
          PAQUETES_RUST: ${{ inputs.paquetes_rust }}
        run: |
          # Diez segundos por conexión y tres reintentos, en vez de los treinta
          # por omisión. El espejo de Azure a veces deja una descarga colgada:
          # medido en vasak-settings, siete paquetes esperaron treinta segundos
          # cada uno antes de pasar al espejo siguiente, y la tanda de apt tardó
          # 312 s cuando en el repositorio de al lado, con la misma lista, tardó
          # 28. Con el tiempo corto el salto al otro espejo llega antes.
          apt=(sudo apt-get -o Acquire::http::Timeout=10 -o Acquire::Retries=3)
          "${apt[@]}" update
          # Sin comillas a propósito, como el `cargo test` de más abajo: son
          # varios paquetes y tienen que llegar como argumentos separados.
          # shellcheck disable=SC2086
          "${apt[@]}" install --no-install-recommends --yes $PAQUETES_RUST

      # ── El Rust que no se prueba, dicho en voz alta ──────────────────────
      #
      # Sin `pruebas_rust` no hay pruebas de Rust en CI ni informe de
      # cobertura, y Sonar **no cuenta** esas líneas como código a cubrir: no
      # salen al 0%, directamente no existen para la puerta. Medido en
      # `vasak-flare-daemon`: 1.382 líneas de Rust y 107 «líneas a cubrir»,
      # todas de TypeScript. Un PR que sólo toca Rust llega a la puerta con
      # `new_lines_to_cover = 0` y la condición de cobertura no se evalúa, así
      # que pasa siempre (vasak-flare-daemon#37, vasak-settings#160).
      #
      # Es un aviso y no un error porque encenderlo es una decisión de cada
      # repositorio —qué crates, qué paquetes de sistema—; lo que no puede
      # pasar es que esa ausencia no se vea.
      - name: El Rust de este repositorio se mide
        if: inputs.rust && inputs.pruebas_rust == '' && (hashFiles('Cargo.toml') != '' || hashFiles('src-tauri/Cargo.toml') != '')
        run: |
          echo "::warning::Este repositorio tiene Rust y no pasa «pruebas_rust»: sus pruebas de Rust no corren en CI y Sonar no ve esas líneas como código a cubrir, así que la puerta de cobertura no las mide. Para medirlas, pasá «pruebas_rust» (y «paquetes_rust» si el grafo pide bibliotecas del sistema) en el ci.yml del repositorio."

      # `cargo-llvm-cov` acá, en `revisar`, y no en `sonar`: las pruebas de
      # Rust corren **una sola vez**, instrumentadas, y de esa corrida sale el
      # informe que `sonar` sube. Antes se compilaba el grafo dos veces —una
      # en cada trabajo, cada una con su tanda de apt—, y en un crate de Tauri
      # cada compilación son minutos.
      #
      # `continue-on-error`: si la herramienta no se puede instalar, las
      # pruebas igual corren —sin instrumentar— en el paso de abajo. Un corte
      # de red en la instalación no puede dejar a `revisar` en rojo ni, peor,
      # sin correr las pruebas.
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        if: ${{ !cancelled() && inputs.pruebas_rust != '' }}
        continue-on-error: true
        # Binario ya compilado, de segundos. Al commit de la release y con la
        # versión explícita: el atajo `@cargo-llvm-cov` lo mueve la propia
        # acción con cada versión, y clavarlo al commit dejaría el flujo
        # apuntando a un commit que ya no está («impostor-commit» de zizmor).
        with:
          tool: cargo-llvm-cov@0.9.1

      # La caché del directorio `target/` y del registro de cargo. Sin ella,
      # cada corrida compila el grafo entero en frío, y el de una aplicación
      # de Tauri son cuatrocientos crates. Se guarda sólo desde `main`: los PR
      # la leen y no la escriben, para que las ramas no se pisen el espacio
      # de caché del repositorio (10 GB) con compilaciones de una sola vez.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !cancelled() && inputs.pruebas_rust != '' }}
        with:
          workspaces: ${{ hashFiles('Cargo.toml') == '' && hashFiles('src-tauri/Cargo.toml') != '' && 'src-tauri' || '.' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Pruebas de Rust
        if: ${{ !cancelled() && inputs.pruebas_rust != '' }}
        # Por variable de entorno y no con `${{ }}` dentro del script: la
        # plantilla se pega como texto en el bash antes de correr, así que un
        # valor con `;` o `$( )` se ejecutaría. Viene de quien llama, que hoy
        # es de confianza, pero es la forma de que no dependa de eso.
        env:
          PRUEBAS_RUST: ${{ inputs.pruebas_rust }}
        run: |
          # ── Qué decide el color de este paso, y qué no ────────────────────
          #
          # El color lo deciden **las pruebas**, igual que cuando esto era un
          # `cargo test` a secas. La cobertura es un subproducto: si no se
          # puede medir —falta la herramienta, falla la instrumentación, el
          # informe sale raro— se avisa, se borra el informe y el paso sigue
          # con el color de las pruebas. Un problema de cobertura no puede
          # frenar un merge, que es la razón por la que esto vivía en `sonar`.
          #
          # Sin `-e`: cada fallo se mira a mano, porque los de la cobertura se
          # tragan y los de las pruebas no. Hay que apagarlo explícitamente:
          # GitHub corre el script con `bash -e`, y un `set -uo pipefail` solo
          # no lo saca.
          set +e
          set -uo pipefail

          raiz=$GITHUB_WORKSPACE
          informe="$raiz/coverage/rust.lcov"
          # `cargo-llvm-cov` no crea el directorio del informe: sin esto falla
          # con «failed to create file 'coverage/rust.lcov'».
          mkdir -p "$raiz/coverage"
          rm -f "$informe"

          dir=.
          [ -f src-tauri/Cargo.toml ] && [ ! -f Cargo.toml ] && dir=src-tauri

          medir=true
          if ! command -v cargo-llvm-cov >/dev/null 2>&1; then
            echo "::warning::No está cargo-llvm-cov; las pruebas de Rust corren sin instrumentar y no hay cobertura de Rust en esta corrida."
            medir=false
          elif ! rustup component add llvm-tools-preview; then
            # `llvm-cov` y `llvm-profdata` son los del toolchain, y el
            # componente que los trae no viene en la instalación por omisión.
            echo "::warning::No se pudo instalar llvm-tools-preview; las pruebas de Rust corren sin instrumentar y no hay cobertura de Rust en esta corrida."
            medir=false
          fi

          cd "$dir"
          # Sin `--all-targets`: alcanza con las pruebas, y compilar los
          # ejemplos y los benchmarks sería tiempo sin nada a cambio.
          #
          # Sin comillas a propósito: son varios `-p crate` que tienen que
          # llegar como argumentos separados. Y **no** `--workspace`: en
          # `vasak-keyring` y `vasak-permissions` el espacio de trabajo incluye
          # el crate de Tauri, que `pruebas_rust` deja afuera a propósito.
          if [ "$medir" = true ]; then
            # shellcheck disable=SC2086
            if ! cargo llvm-cov $PRUEBAS_RUST --lcov --output-path="$informe"; then
              # El fallo puede ser de las pruebas o de la instrumentación, y
              # desde acá no se distinguen. Lo decide un `cargo test` común:
              # si ése también falla, el rojo es de las pruebas; si pasa, el
              # problema era de la cobertura y no tiene por qué voltear el
              # paso. Es una segunda compilación, pero sólo cuando algo ya
              # salió mal.
              rm -f "$informe"
              echo "::warning::Falló la corrida instrumentada; se repiten las pruebas sin instrumentar para saber si el rojo es de ellas."
              # shellcheck disable=SC2086
              cargo test $PRUEBAS_RUST || exit 1
              echo "::warning::Las pruebas pasan sin instrumentar: lo que falló fue la cobertura. Esta corrida sale sin cobertura de Rust."
            fi
          else
            # shellcheck disable=SC2086
            cargo test $PRUEBAS_RUST || exit 1
          fi

          # Desde acá las pruebas ya pasaron, y nada de lo que sigue puede
          # cambiar eso: cada problema del informe avisa, lo borra y sale en 0.
          [ -f "$informe" ] || exit 0

          # ── El informe es una medición, o no es nada ──────────────────────
          #
          # El invariante es uno solo, en dos mitades: **ninguna ruta del
          # repositorio puede quedar absoluta**. Antes del `sed` se comprueba
          # que haya por lo menos una, porque si no hay ninguna el prefijo no
          # es el que creíamos y el `sed` no tocaría nada: dejaría un informe
          # de apariencia normal con rutas que Sonar no resuelve a ningún
          # archivo, sobre el que no dice nada.
          medidos=$(grep -cF "SF:${raiz}/" "$informe" 2>/dev/null || true)
          medidos=${medidos:-0}
          if [ "$medidos" -eq 0 ]; then
            echo "::warning::El informe de cobertura de Rust no nombra ningún archivo bajo «${raiz}»: no se midió nada. Eso no es una cobertura de 0%, es la ausencia de cobertura, y el archivo se borra para que no quede con forma de informe."
            rm -f "$informe"
            exit 0
          fi

          # Las rutas salen absolutas —las de la máquina que compiló— y Sonar
          # las quiere relativas a la raíz del repositorio. `cargo-llvm-cov` no
          # tiene opción para esto: se verificó en 0.9.1.
          sed -i "s|^SF:${raiz}/|SF:|" "$informe"

          # Y después se comprueba que no quede ninguna del repositorio, en
          # vez de asumir que el `sed` acertó. Sólo las de la raíz: las fuentes
          # de la biblioteca estándar —que entran en cuanto algún crate usa
          # `thread_local!`— no son del proyecto, Sonar las ignora, y contarlas
          # como error le sacó el informe entero a `vasak-keyring` una vez.
          sin_convertir=$(grep -cF "SF:${raiz}/" "$informe" 2>/dev/null || true)
          sin_convertir=${sin_convertir:-0}
          if [ "$sin_convertir" -ne 0 ]; then
            echo "::warning::No se sube el informe de Rust: quedaron ${sin_convertir} rutas del repositorio sin convertir a relativas y el prefijo que se quitó era «${raiz}». Sin esto Sonar no resolvería los archivos y la cobertura no entraría sin avisar."
            rm -f "$informe"
            exit 0
          fi

          # Un miembro del espacio de trabajo que `pruebas_rust` no nombra no
          # entra en el informe: `cargo-llvm-cov` lo arma con los crates que se
          # probaron, no con los que compilaron. Se nombran, para que el 0% de
          # sus archivos se lea como lo que es.
          sin_medir=$(cargo metadata --no-deps --format-version 1 2>/dev/null \
            | python3 -c '
          import json, os, sys
          raiz, informe = sys.argv[1], sys.argv[2]
          medidos = {l[3:].strip() for l in open(informe, encoding="utf-8", errors="replace") if l.startswith("SF:")}
          miembros = []
          for p in json.load(sys.stdin)["packages"]:
              d = os.path.relpath(os.path.dirname(p["manifest_path"]), raiz)
              miembros.append((p["name"], "" if d == "." else d + "/"))
          print(" ".join(n for n, prefijo in miembros if not any(f.startswith(prefijo) for f in medidos)))
          ' "$raiz" "$informe" 2>/dev/null || true)
          if [ -n "$sin_medir" ]; then
            echo "::warning::Miembros del espacio de trabajo que no aparecen en el informe porque «pruebas_rust» no los nombra: ${sin_medir}. Sus archivos van a figurar como cubiertos cero en Sonar, y no es que estén sin probar."
          fi

          # Los números y no sólo el «se generó»: un paso que dice que midió
          # sin decir qué midió es el mismo problema del informe vacío.
          python3 - "$informe" <<'RESUMEN' || echo "::warning::No se pudo resumir el informe; se sube igual."
          import sys
          archivos = lineas = cubiertas = 0
          for linea in open(sys.argv[1], encoding="utf-8", errors="replace"):
              if linea.startswith("SF:"):
                  archivos += 1
              elif linea.startswith("DA:"):
                  campos = linea[3:].strip().split(",")
                  if len(campos) < 2 or not campos[1].lstrip("-").isdigit():
                      continue
                  lineas += 1
                  if int(campos[1]) > 0:
                      cubiertas += 1
          porcentaje = 100 * cubiertas / lineas if lineas else 0
          print(f"Cobertura de Rust: {archivos} archivos, {cubiertas}/{lineas} líneas ({porcentaje:.1f}%)")
          RESUMEN
          exit 0

      # El informe pasa a `sonar` como artefacto. Sólo si existe: el paso de
      # arriba lo borra cuando no es una medición, y entonces no hay nada que
      # pasar —ni la propiedad, que `sonar` pone sólo si lo recibe—. Un día
      # de retención alcanza: lo lee el trabajo de al lado, minutos después.
      - name: Pasar la cobertura de Rust a «sonar»
        if: ${{ !cancelled() && inputs.pruebas_rust != '' && hashFiles('coverage/rust.lcov') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura-rust
          path: coverage/rust.lcov
          retention-days: 1
          if-no-files-found: ignore

  # ── Seguridad: las dependencias y los propios workflows ──────────────────
  #
  # Trabajo aparte y no pasos de `revisar` por dos motivos. Uno, que las
  # reglas de `main` exigen `app / revisar` y nada más: esto se estrena
  # avisando, y si viviera ahí adentro un aviso mal calibrado frenaría todos
  # los merges de la organización. Dos, que corre en paralelo y no le suma
  # minutos a la revisión.
  seguridad:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # OSV lee los dos candados que se empaquetan —`bun.lock` y
      # `Cargo.lock`— contra la base de osv.dev, que junta los avisos de
      # GitHub, de RustSec y de npm. Una sola herramienta para las dos mitades
      # del taller, en vez de `cargo audit` por un lado y otra cosa por el otro.
      #
      # Ojo que RustSec también publica los crates **sin mantenimiento**, y
      # buena parte de lo que sale en una aplicación de Tauri es eso: la pila
      # de GTK 3 que Tauri trae y que no tiene reemplazo mientras Tauri no lo
      # cambie. Por eso esto avisa y no corta hasta que cada repositorio lo
      # pida.
      - name: Vulnerabilidades conocidas en las dependencias
        env:
          CORTA: ${{ inputs.seguridad_corta }}
        run: |
          set -uo pipefail

          mapfile -t candados < <(git ls-files '*bun.lock' '*Cargo.lock' '*package-lock.json')
          if [ ${#candados[@]} -eq 0 ]; then
            echo "Este repositorio no versiona ningún candado; nada que comprobar."
            exit 0
          fi

          # Clavado a la versión y al hash, por lo mismo que las acciones van
          # clavadas al commit: lo que se baja acá se ejecuta.
          version=v2.6.0
          suma=ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
          binario="$RUNNER_TEMP/osv-scanner"
          curl -fsSL -o "$binario" \
            "https://github.com/google/osv-scanner/releases/download/$version/osv-scanner_linux_amd64" || {
            echo "::error::No se pudo bajar osv-scanner; el paso no llegó a mirar nada."
            exit 1
          }
          echo "$suma  $binario" | sha256sum -c --quiet - || {
            echo "::error::El binario de osv-scanner no coincide con el hash esperado."
            exit 1
          }
          chmod +x "$binario"

          argumentos=()
          for candado in "${candados[@]}"; do
            argumentos+=(--lockfile "$candado")
          done

          # Los códigos de salida de osv-scanner separan «encontró algo» (1) de
          # «no pudo» (127) y de «no había paquetes» (128). Tratarlos igual
          # daría verde sin haber mirado, que es peor que no tener el paso.
          estado=0
          "$binario" scan source "${argumentos[@]}" --format table || estado=$?
          case "$estado" in
            0|128)
              echo "Sin vulnerabilidades conocidas en: ${candados[*]}." ;;
            1)
              if [ "$CORTA" = "true" ]; then
                echo "::error::Hay dependencias con avisos publicados. El detalle está arriba."
                exit 1
              fi
              echo "::warning::Hay dependencias con avisos publicados. Por ahora sólo avisa: el detalle está en el log de «seguridad»." ;;
            *)
              echo "::error::osv-scanner no pudo terminar (salió con $estado); el paso no llegó a mirar nada."
              exit 1 ;;
          esac

      # zizmor lee los workflows del repositorio buscando lo que ya mordió a
      # otros proyectos: acciones sin clavar, inyección por plantilla, tokens
      # que quedan en disco, permisos de más.
      - name: Los workflows del repositorio
        if: hashFiles('.github/workflows/*.yml', '.github/workflows/*.yaml') != ''
        env:
          CORTA: ${{ inputs.seguridad_corta }}
        run: |
          set -uo pipefail

          # Los flujos propios se llaman con `@main` **a propósito** —los treinta
          # y pico repositorios se mueven juntos con este archivo, ver arriba—,
          # así que para `Vasak-OS/*` alcanza con una referencia. Para todo lo
          # demás, el hash.
          configuracion="$RUNNER_TEMP/zizmor.yml"
          cat > "$configuracion" <<'CONF'
          rules:
            unpinned-uses:
              config:
                policies:
                  "Vasak-OS/*": ref-pin
                  "*": hash-pin
          CONF

          # `--min-severity low` deja afuera los informativos, que son
          # sugerencias —«preferí la publicación de confianza»— y no problemas:
          # con ellos, este aviso saldría en amarillo en casi todos lados y se
          # dejaría de leer.
          #
          # `--offline`: las auditorías que consultan la API de GitHub piden un
          # token, y éste es un trabajo de sólo lectura que no lo necesita.
          estado=0
          pipx run zizmor==1.30.1 --offline --min-severity low --config "$configuracion" \
            --format github .github/workflows || estado=$?

          # zizmor sale con 0 si no encontró nada, con 10 o más si encontró
          # (según la gravedad), y con 1 o 2 si no pudo correr.
          if [ "$estado" -eq 0 ]; then
            echo "Sin hallazgos en los workflows."
          elif [ "$estado" -ge 10 ]; then
            if [ "$CORTA" = "true" ]; then
              echo "::error::zizmor encontró problemas en los workflows; están anotados en el PR."
              exit 1
            fi
            echo "::warning::zizmor encontró problemas en los workflows. Por ahora sólo avisa."
          else
            echo "::error::zizmor no pudo correr (salió con $estado); el paso no llegó a mirar nada."
            exit 1
          fi

  # ── SonarQube Cloud ──────────────────────────────────────────────────────
  #
  # Ya había ocho proyectos en la organización `vasakos` de SonarQube Cloud,
  # pero en análisis automático: ése no mira Rust —medido, el escritorio sale
  # con cero líneas de Rust— ni puede leer cobertura. Desde CI mira las dos
  # mitades y además sabe cuánto de lo que cambia un PR está probado.
  #
  # Sin `SONAR_TOKEN` se saltea y lo dice, en vez de fallar: un PR desde un
  # fork no recibe secretos, y un repositorio que todavía no pasa el token
  # tampoco.
  sonar:
    # Espera a `revisar` porque de ahí sale la cobertura de Rust, y corre
    # aunque `revisar` falle: con pruebas en rojo el análisis igual sirve, y
    # una puerta que sólo mira los PR verdes no ve nada. Lo único que lo
    # saltea es que se cancele la corrida.
    needs: revisar
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Hay token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sin SONAR_TOKEN: se saltea el análisis. Quien llama tiene que pasarlo en «secrets»."
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.token.outputs.hay == 'true'
        with:
          persist-credentials: false
          # Sonar asigna cada línea a su commit para saber qué es código nuevo,
          # y para eso necesita el historial entero.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.token.outputs.hay == 'true' && hashFiles('package.json') != ''

      # La cobertura del frontend se saca acá y no en `revisar`: las pruebas
      # de frontend corren dos veces —allá sin cobertura, acá con—, que en
      # `bun test` son segundos. La de Rust, en cambio, sale de la corrida de
      # `revisar` y llega como artefacto, porque compilar el grafo dos veces
      # son minutos; por eso este trabajo espera a `revisar` en vez de correr
      # en paralelo.
      - name: Cobertura del frontend
        if: steps.token.outputs.hay == 'true' && hashFiles('package.json') != ''
        run: |
          # `if !` y no un `$?` después del comando: es la forma que pide el
          # gate de este repositorio (SC2181), y además el `if` ya es un
          # contexto protegido, así que el `set -e` implícito de los pasos de
          # GitHub Actions no corta ahí. El paso «Pruebas de Rust» de `revisar`
          # lleva el mismo cuidado con los fallos de la cobertura.
          #
          # Lo que se evita: si `bun install` falla, el paso moría y con él el
          # escaneo, dejando al repositorio sin análisis por un problema de
          # dependencias. Eso es la ceguera que este trabajo tapa, no algo que
          # haya que propagar.
          if ! bun install --frozen-lockfile; then
            echo "::warning::Falló «bun install»; la cobertura del frontend no se mide en esta corrida. El rojo de las pruebas lo marca «revisar», y el análisis sigue igual: Sonar va a ver 0% de cobertura en código nuevo, que es la cifra honesta."
            exit 0
          fi
          # Sólo donde el script es exactamente `bun test`: ahí se le puede
          # sumar la cobertura sin cambiar qué corre. Un script armado a mano
          # —un bucle, otro ejecutor— se respeta y queda sin cobertura, que es
          # mejor que medir algo distinto de lo que se prueba.
          guion=$(bun -e 'const p = await Bun.file("package.json").json(); console.log(p.scripts?.test ?? "")')
          if [ "$guion" = "bun test" ]; then
            # Si alguna prueba falla, la cobertura igual sirve: el rojo lo
            # marca `revisar`, que es donde corresponde.
            bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage \
              || echo "::warning::Hubo pruebas en rojo; la cobertura se sube igual."
          else
            echo "El script de pruebas no es «bun test» a secas («${guion:-ninguno}»); sin cobertura."
          fi

      # ── La cobertura de Rust ─────────────────────────────────────────────
      #
      # La mide `revisar`, en la misma corrida que decide si las pruebas
      # pasan, y llega acá como artefacto. Antes este trabajo compilaba el
      # grafo otra vez —con su tanda de apt— sólo para medir: dos
      # compilaciones de lo mismo, en paralelo, en cada PR.
      #
      # `continue-on-error`: si el artefacto no está —las pruebas fallaron
      # antes de medir, la cobertura no se pudo sacar, o el repositorio no
      # pasa `pruebas_rust`— el análisis sigue igual, sin la propiedad.
      - name: Traer la cobertura de Rust de «revisar»
        if: steps.token.outputs.hay == 'true' && inputs.pruebas_rust != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cobertura-rust
          path: coverage

      - name: Cobertura de Rust
        id: cobertura_rust
        if: steps.token.outputs.hay == 'true' && inputs.pruebas_rust != ''
        run: |
          # La propiedad apunta a un archivo, y un archivo que no está es una
          # ruta colgada en el análisis: se pasa sólo si el informe llegó. Sin
          # informe Sonar no ve las líneas de Rust como código a cubrir, y el
          # aviso lo dejó `revisar`.
          if [ -s coverage/rust.lcov ]; then
            echo "Cobertura de Rust recibida: $(grep -c '^SF:' coverage/rust.lcov) archivos."
            echo "propiedad=-Dsonar.rust.lcov.reportPaths=coverage/rust.lcov" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No llegó cobertura de Rust desde «revisar»; el análisis sigue sin ella. El motivo está en el paso «Pruebas de Rust» de «revisar»."
          fi

      - name: Análisis
        if: steps.token.outputs.hay == 'true'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # La clave del proyecto sigue la forma que usa SonarQube Cloud al
          # importar desde GitHub, que es la que ya tienen los ocho de antes.
          #
          # Las pruebas se declaran como pruebas. Si no, Sonar las cuenta como
          # código sin probar —nadie prueba las pruebas— y la cobertura del
          # código nuevo se hunde justo en el PR que más pruebas suma: el
          # primero que lo destapó tenía el código al 100% y salía con 47%. El
          # taller las pone en `tests/` o con `.test.`/`.spec.` en el nombre, y
          # las de integración de Rust en `tests/*.rs`. Un archivo no puede
          # estar a la vez en las dos listas, así que van también en las
          # exclusiones del código.
          #
          # Los `.vue` quedan fuera de la cobertura. Ninguna aplicación del
          # taller monta componentes en las pruebas, así que esas líneas no las
          # cubre ninguna prueba que hoy se pueda escribir, y una puerta que
          # mide lo que nadie puede mover no informa: sólo bloquea el PR que
          # toca la interfaz. Es una decisión, no un truco, y se saca el día
          # que alguna aplicación monte componentes en las pruebas.
          #
          # La propiedad es por lenguaje: `sonar.rust.lcov.reportPaths` para
          # Rust, y un lcov de Rust puesto en el sensor de JavaScript no se
          # importa. Los otros dos nombres que quedan a mano no existen:
          # `sonar.rust.coverageReportPaths` no es el nombre documentado, y
          # `sonar.coverageReportPaths` —que sí existe— es el formato genérico
          # de Sonar y no acepta lcov. Este taller ya se inventó una vez una
          # propiedad, `sonar.cfamily.lcov.reportPaths`, y el resultado fue
          # cobertura en 0% sin decir por qué. Con una propiedad que Sonar no
          # reconoce no avisa: el panel muestra 0% y nada más.
          #
          # Y **condicional**, a diferencia de la de JavaScript. La propiedad
          # apunta a un archivo, y un archivo que no está es una ruta colgada
          # en el análisis: de los treinta y pico repositorios que llaman a
          # este flujo, cuatro miden Rust y el resto no tiene ni una línea, así
          # que pasar la propiedad siempre pondría una ruta inexistente en
          # todos los demás. El paso de cobertura deja la salida vacía cuando
          # no hay informe, y acá una salida vacía no interpola nada.
            # `-Dsonar.tests=.` se quitó. Decía «todo el proyecto es código de
          # prueba» y, junto con el `test.inclusions` de abajo, que sólo
          # acepta `**/tests/**`, `*.test.*` y `*.spec.*`, dejaba **fuera del
          # análisis todo archivo que no fuera de prueba**: en Sonar, un
          # archivo dentro del ámbito de pruebas que no entra en
          # `test.inclusions` no vuelve a ser código de producción, se
          # descarta. Y como `test.inclusions` no distingue mayúsculas, el
          # `pruebas/` de los repositorios en español tampoco entraba, así que
          # en la práctica no entraba casi nada.
          #
          # Medido, no supuesto, sobre `vasak-update` con y sin esta línea:
          #
          #   con    `-Dsonar.tests=.`:  0 languages detected in 0 preprocessed
          #                                files, 107 files ignored, 0 indexed
          #   sin la línea:              2 languages detected in 13 preprocessed
          #                                files, 0 ignored por patrón, 13 indexed
          #
          # Y el efecto no era sólo de conteo: sin archivos, el sensor de Rust
          # ni siquiera arrancaba, y la cobertura de Rust que sube el paso de
          # más arriba no tenía contra qué adjuntarse.
          args: >
            -Dsonar.organization=vasakos
            -Dsonar.projectKey=Vasak-OS_${{ github.event.repository.name }}
            -Dsonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/coverage/**,src-tauri/gen/**,**/tests/**,**/*.test.*,**/*.spec.*
            -Dsonar.test.inclusions=**/tests/**,**/test/**,**/pruebas/**,**/*.test.*,**/*.spec.*,**/tests.rs,**/*_test.rs
            -Dsonar.test.exclusions=**/node_modules/**,**/target/**,**/dist/**
            -Dsonar.coverage.exclusions=**/*.vue
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            ${{ steps.cobertura_rust.outputs.propiedad }}
