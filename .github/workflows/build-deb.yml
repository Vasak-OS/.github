# El `.deb` de una aplicación, compartido por las veinte que lo producen.
#
# ── Qué lo dispara ──────────────────────────────────────────────────────────
#
# Un release publicado, y nada más. Es lo contrario de lo que hace
# `publicar-plugin.yml`, que mira si falta la versión en el registro justamente
# para no depender de que alguien se acuerde de una ceremonia: allá el gesto
# tenía que ser automático porque de crates.io no se puede borrar y ocho
# versiones de `vue-libvasak` se perdieron así.
#
# Acá la decisión es distinta a propósito. Publicar un release **es** el gesto
# deliberado de decir «esta versión sale», y el taller sube la versión en cada
# merge: atar la compilación al merge daría un release por merge. Lo que se
# gana es que el `.deb` acompaña al release que ya existía; lo que se acepta es
# que una versión sin release no genera nada, que es exactamente lo que se
# quería decir al no publicarla.
#
# ── Dos trabajos y no uno ───────────────────────────────────────────────────
#
# Por el mismo motivo que en la publicación de los plugins, pero al revés: acá
# no es para que una mitad caída deje trabajar a la otra, es por el token.
# Compilar corre `bun install` y los build scripts de cargo —código de terceros,
# varios cientos de paquetes— y colgar el archivo del release necesita
# `contents: write`. Juntos, ese código correría con un token que puede
# reescribir el repositorio. Separados, el que compila no puede escribir nada y
# el que escribe no ejecuta nada ajeno: baja un archivo y lo sube.
#
# ── Y por qué no hay caché ──────────────────────────────────────────────────
#
# Porque no serviría. La caché de Actions se indexa por rama, y esto corre sobre
# la etiqueta del release: la entrada que dejó el último release ya no está o no
# se alcanza, así que cada corrida compilaría de cero igual pero con un paso más
# que falla en silencio y da la sensación de que algo se está reutilizando. En
# un flujo que corre cuando se publica una versión —no en cada push— media hora
# de compilación es el precio correcto.

name: Compilar el .deb

on:
  workflow_call:
    inputs:
      system_packages:
        description: >
          Paquetes de apt que esta aplicación necesita además de la pila de
          Tauri, separados por espacios. Vacío por omisión: los `makedepends`
          de las veinte recetas son los mismos y ninguna pide nada propio
          todavía. Está para que la primera que lo necesite no tenga que tocar
          este archivo, que corre en las otras diecinueve.
        type: string
        default: ''

# Dos corridas sobre el mismo release subirían el mismo archivo a la vez. No se
# cancela la que está en curso: cancelar a mitad de la subida deja el release
# con un `.deb` a medio escribir, que se baja y no instala.
concurrency:
  group: build-deb-${{ github.repository }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # ── Compilar ───────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    # Sólo lectura, y es el trabajo donde corre todo el código ajeno. Lo que
    # escribe en el release es el otro.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      deb: ${{ steps.bundle.outputs.deb }}
    steps:
      - name: Esto se dispara con un release
        env:
          TAG: ${{ github.event.release.tag_name }}
          EVENTO: ${{ github.event_name }}
        run: |
          # Un caller que lo llame desde otro evento llegaría hasta acá con la
          # etiqueta vacía, compilaría media hora y fallaría recién al subir.
          if [ -z "$TAG" ]; then
            echo "::error::No hay release en este evento ($EVENTO). Este flujo se llama desde «on: release»."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Acá pesa más que en los chequeos: abajo corren `bun install` y los
          # build scripts de cargo. La credencial del checkout no tiene por qué
          # quedar en el disco donde ese código puede leerla.
          persist-credentials: false

      # Igual que en `app.yml`: el guardia vive en un archivo con pruebas y no
      # incrustado acá, porque lo que se puede equivocar en silencio es qué
      # versión va a llevar el bundle.
      #
      # Se toma de `main` porque con `@main` se llama este mismo flujo, y
      # clavarlo separaría el script del flujo.
      #
      # Lo correcto sería `job.workflow_sha`, que es el commit de **este**
      # archivo: `main` es lo que haya en `main` cuando corre el paso, así que
      # un merge en el medio le daría a esta corrida el flujo viejo con el
      # script nuevo. Pero actionlint 1.7.12 no conoce ese contexto todavía y
      # lo da por mal escrito, y el paso que lo corre corta. La ventana es de
      # segundos y esto se dispara con un release, así que se espera: cuando
      # actionlint lo acepte, se cambia acá y en `app.yml`, que tiene lo mismo.
      - name: Traer los scripts compartidos
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Vasak-OS/.github
          persist-credentials: false
          ref: main
          path: .vasak-ci

      - name: La etiqueta y el manifiesto dicen lo mismo
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Antes de instalar nada y antes de compilar: enterarse acá cuesta
          # cinco segundos y enterarse después cuesta la compilación entera.
          estado=0
          python3 .vasak-ci/scripts/release_version.py --tag "$TAG" || estado=$?
          # El directorio traído queda dentro del árbol que se va a empaquetar.
          # Se saca apenas se usa, y el código de salida se conserva a mano
          # porque `rm` lo pisaría.
          rm -rf .vasak-ci
          exit $estado

      - name: Las dependencias de sistema
        env:
          EXTRA: ${{ inputs.system_packages }}
        run: |
          # Por variable de entorno y no pegado en el script: lo que llega del
          # caller se ejecutaría si trajera `;` o `$( )`.
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            $EXTRA

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Compilar
        env:
          # Lo mismo que hace cada PKGBUILD, y por el mismo motivo: un paquete
          # no se compila para la máquina que le tocó compilarlo. El runner de
          # hoy no es el de mañana, y `target-cpu` sin fijar deja que cargo
          # emita lo que el runner sepa hacer. `x86-64` es la línea de base que
          # todas las máquinas de 64 bits implementan, y es el `arch` que
          # declaran las recetas.
          RUSTFLAGS: -C opt-level=3 -C target-cpu=x86-64
          CARGO_BUILD_RUSTFLAGS: -C opt-level=3 -C target-cpu=x86-64
        # `--locked` como en la receta: sin él un candado desfasado se resuelve
        # solo y en silencio, y el `.deb` que se publica no es el que compila
        # `makepkg`.
        run: bun run tauri build -- --locked

      - name: Encontrar el .deb
        id: bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          encontrados=(src-tauri/target/release/bundle/deb/*.deb)

          if [ ${#encontrados[@]} -eq 0 ]; then
            echo "::error::La compilación terminó bien y no dejó ningún .deb. Mirá que «bundle.targets» siga diciendo «deb» en tauri.conf.json."
            exit 1
          fi
          if [ ${#encontrados[@]} -gt 1 ]; then
            # Subir «el primero» de varios es elegir a ciegas cuál se publica.
            printf '%s\n' "${encontrados[@]}"
            echo "::error::Hay ${#encontrados[@]} archivos .deb y este flujo publica uno."
            exit 1
          fi

          deb="${encontrados[0]}"
          # El guardia de la versión ya corrió, pero sobre los manifiestos. Esto
          # mira el archivo que de verdad se produjo: es lo único que prueba que
          # lo que se va a colgar del release se llama como el release.
          if ! printf '%s' "$(basename "$deb")" | grep -qF "_${VERSION}_"; then
            echo "::error::El bundle se llama «$(basename "$deb")» y el release es la $VERSION."
            exit 1
          fi

          echo "deb=$deb" >> "$GITHUB_OUTPUT"
          ls -lh "$deb"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb
          path: ${{ steps.bundle.outputs.deb }}
          # No hace falta que sobreviva: el que lo necesita corre a
          # continuación, y lo que se quiere conservar queda colgado del
          # release. Noventa días de retención por omisión es guardar veinte
          # veces lo mismo.
          retention-days: 1
          if-no-files-found: error

  # ── Colgarlo del release ───────────────────────────────────────────────────
  #
  # Este trabajo tiene el token que escribe y no ejecuta nada de terceros: baja
  # un archivo y lo sube. Ni checkout hace falta.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deb
          path: bundle

      - name: Subirlo al release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          deb=$(find bundle -name '*.deb' -type f)
          # `--clobber` para que reintentar sea barato: sin él, una corrida que
          # se cayó después de subir deja el release con el archivo puesto y el
          # reintento falla diciendo que ya existe.
          gh release upload "$TAG" "$deb" --clobber --repo "$REPO"
          {
            echo "### El paquete"
            echo
            echo "| release | archivo |"
            echo "|---|---|"
            echo "| \`$TAG\` | \`$(basename "$deb")\` |"
          } >> "$GITHUB_STEP_SUMMARY"
